<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YUNCO — Sistema de Gestión</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  /* Paleta principal */
  --bg-base:       #080f1a;
  --bg-surface:    #0d1929;
  --bg-card:       #111f33;
  --bg-card-hover: #162540;
  --bg-input:      #0a1525;

  /* Bordes */
  --border-subtle: rgba(255,255,255,.06);
  --border-mid:    rgba(74,159,212,.2);
  --border-strong: rgba(74,159,212,.45);

  /* Texto */
  --text-primary:   #eef4fb;
  --text-secondary: #8baec8;
  --text-muted:     #4d6a82;

  /* Acento azul */
  --accent:        #2d7fba;
  --accent-light:  #4a9fd4;
  --accent-glow:   rgba(45,127,186,.35);

  /* Estados */
  --success:       #22c55e;
  --success-bg:    rgba(34,197,94,.1);
  --danger:        #ef4444;
  --danger-bg:     rgba(239,68,68,.1);
  --warning:       #f59e0b;

  /* Espaciado sistemático */
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 20px;
  --space-6: 24px;
  --space-8: 32px;
  --space-10: 40px;

  /* Radios */
  --radius-sm: 6px;
  --radius-md: 10px;
  --radius-lg: 14px;
  --radius-xl: 20px;

  /* Sombras */
  --shadow-card: 0 4px 24px rgba(0,0,0,.4), 0 1px 0 rgba(255,255,255,.04) inset;
  --shadow-elevated: 0 8px 40px rgba(0,0,0,.5), 0 1px 0 rgba(255,255,255,.06) inset;
  --shadow-glow: 0 0 32px rgba(45,127,186,.25);
}

*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

body {
  font-family: 'Barlow', sans-serif;
  background: var(--bg-base);
  min-height: 100vh;
  color: var(--text-primary);
  overflow-x: hidden;
  font-size: 14px;
  line-height: 1.5;
}

body::before {
  content: '';
  position: fixed;
  inset: 0;
  pointer-events: none;
  background:
    radial-gradient(ellipse 80% 60% at 15% 0%, rgba(31,78,120,.5) 0%, transparent 55%),
    radial-gradient(ellipse 60% 40% at 85% 100%, rgba(13,60,100,.4) 0%, transparent 50%);
}

/* ── LOGIN ──────────────────────────────────────────────────── */
.login-wrap {
  position: fixed;
  inset: 0;
  z-index: 100;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: var(--space-5);
}

.login-box {
  background: var(--bg-card);
  border: 1px solid var(--border-mid);
  border-radius: var(--radius-xl);
  padding: var(--space-10) var(--space-8);
  width: 100%;
  max-width: 400px;
  text-align: center;
  box-shadow: var(--shadow-elevated), var(--shadow-glow);
  animation: fadeUp .5s cubic-bezier(.16,1,.3,1) both;
  position: relative;
  overflow: hidden;
}

.login-box::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(74,159,212,.6), transparent);
}

.login-logo {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 56px;
  color: #c0392b;
  -webkit-text-stroke: 2px rgba(80,30,20,.6);
  letter-spacing: 4px;
  margin-bottom: var(--space-1);
  line-height: 1;
}

.login-empresa {
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 3px;
  text-transform: uppercase;
  color: var(--text-muted);
  margin-bottom: var(--space-1);
}

.login-sub {
  font-size: 13px;
  color: var(--text-secondary);
  margin-bottom: var(--space-8);
}

.login-box select,
.login-box input {
  width: 100%;
  background: var(--bg-input);
  border: 1px solid var(--border-subtle);
  color: var(--text-primary);
  padding: 13px var(--space-4);
  border-radius: var(--radius-md);
  font-family: 'Barlow', sans-serif;
  font-size: 14px;
  outline: none;
  margin-bottom: var(--space-3);
  transition: border-color .2s, box-shadow .2s;
}

.login-box select:focus,
.login-box input:focus {
  border-color: var(--border-strong);
  box-shadow: 0 0 0 3px rgba(45,127,186,.15);
}

.login-box select option { background: #111f33; }

.login-btn {
  width: 100%;
  background: linear-gradient(135deg, var(--accent) 0%, var(--accent-light) 100%);
  color: #fff;
  border: none;
  padding: 14px;
  border-radius: var(--radius-md);
  font-family: 'Barlow', sans-serif;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
  letter-spacing: .5px;
  transition: opacity .2s, transform .15s;
  position: relative;
  overflow: hidden;
}

.login-btn:hover { opacity: .9; transform: translateY(-1px); }
.login-btn:active { transform: translateY(0); }

.login-error {
  color: var(--danger);
  font-size: 12px;
  margin-top: var(--space-3);
  display: none;
  background: var(--danger-bg);
  border-radius: var(--radius-sm);
  padding: var(--space-2) var(--space-3);
}

/* ── SISTEMA WRAP ───────────────────────────────────────────── */
.sistema-wrap {
  display: none;
  min-height: 100vh;
  flex-direction: column;
}

/* ── TOPBAR ─────────────────────────────────────────────────── */
.topbar {
  background: rgba(8,15,26,.92);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border-subtle);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: var(--space-4) var(--space-6);
  position: sticky;
  top: 0;
  z-index: 50;
}

.topbar-left { display: flex; align-items: center; gap: var(--space-4); }

.sistema-logo {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 20px;
  letter-spacing: 2px;
  color: var(--text-primary);
}

.topbar-right { display: flex; align-items: center; gap: var(--space-3); }

.user-badge {
  background: var(--success-bg);
  border: 1px solid rgba(34,197,94,.25);
  padding: 6px var(--space-4);
  border-radius: var(--radius-md);
  font-size: 13px;
  font-weight: 700;
  color: var(--success);
  letter-spacing: .3px;
}

.logout-btn {
  background: transparent;
  border: 1px solid var(--border-subtle);
  color: var(--text-muted);
  padding: 6px var(--space-4);
  border-radius: var(--radius-md);
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  font-family: 'Barlow', sans-serif;
  transition: color .2s, border-color .2s;
}

.logout-btn:hover { color: var(--danger); border-color: rgba(239,68,68,.3); }

/* ── MENÚ CONTENIDO ─────────────────────────────────────────── */
.contenido {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: var(--space-10) var(--space-6);
}

.menu-wrap { width: 100%; max-width: 580px; }

.menu-titulo {
  text-align: center;
  margin-bottom: var(--space-10);
}

.menu-titulo h1 {
  font-family: 'Bebas Neue', sans-serif;
  font-size: clamp(28px, 5vw, 44px);
  letter-spacing: 2px;
  margin-bottom: var(--space-2);
  color: var(--text-primary);
}

.menu-titulo p {
  color: var(--text-secondary);
  font-size: 14px;
  font-weight: 500;
}

.modulos-grid {
  display: flex;
  flex-direction: column;
  gap: var(--space-3);
}

.modulo {
  display: flex;
  align-items: center;
  gap: var(--space-5);
  background: var(--bg-card);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-lg);
  padding: var(--space-5) var(--space-6);
  text-decoration: none;
  cursor: pointer;
  transition: transform .2s cubic-bezier(.16,1,.3,1),
              box-shadow .2s,
              border-color .2s,
              background .2s;
  box-shadow: var(--shadow-card);
  position: relative;
  overflow: hidden;
}

.modulo::before {
  content: '';
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: 3px;
  background: transparent;
  transition: background .2s;
  border-radius: 3px 0 0 3px;
}

.modulo:hover {
  transform: translateY(-2px) translateX(2px);
  background: var(--bg-card-hover);
}

.modulo.azul::before { background: var(--accent-light); }
.modulo.verde::before { background: var(--success); }
.modulo.naranja::before { background: var(--warning); }
.modulo.esmeralda::before { background: #10b981; }
.modulo.violeta::before { background: #8b5cf6; }

.modulo.azul:hover { border-color: rgba(74,159,212,.35); box-shadow: var(--shadow-card), 0 0 24px rgba(45,127,186,.15); }
.modulo.verde:hover { border-color: rgba(34,197,94,.3); box-shadow: var(--shadow-card), 0 0 24px rgba(34,197,94,.1); }
.modulo.naranja:hover { border-color: rgba(245,158,11,.3); box-shadow: var(--shadow-card), 0 0 24px rgba(245,158,11,.1); }
.modulo.esmeralda:hover { border-color: rgba(16,185,129,.3); box-shadow: var(--shadow-card), 0 0 24px rgba(16,185,129,.1); }

.icono-wrap {
  width: 48px; height: 48px;
  border-radius: var(--radius-md);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  font-size: 22px;
}

.azul .icono-wrap  { background: rgba(45,127,186,.2); border: 1px solid rgba(74,159,212,.25); }
.verde .icono-wrap { background: rgba(34,197,94,.15); border: 1px solid rgba(34,197,94,.2); }
.naranja .icono-wrap { background: rgba(245,158,11,.15); border: 1px solid rgba(245,158,11,.2); }
.esmeralda .icono-wrap { background: rgba(16,185,129,.15); border: 1px solid rgba(16,185,129,.2); }
.violeta .icono-wrap { background: rgba(139,92,246,.15); border: 1px solid rgba(139,92,246,.2); }

.mod-nombre {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 20px;
  letter-spacing: 1px;
  line-height: 1;
  margin-bottom: 3px;
  color: var(--text-primary);
}

.mod-desc {
  font-size: 12px;
  color: var(--text-secondary);
  font-weight: 500;
}

.flecha {
  color: var(--text-muted);
  font-size: 18px;
  margin-left: auto;
  transition: transform .2s, color .2s;
}

.modulo:hover .flecha {
  transform: translateX(4px);
  color: var(--text-secondary);
}

.pie {
  text-align: center;
  padding: var(--space-5);
  color: var(--text-muted);
  font-size: 11px;
  letter-spacing: .5px;
  border-top: 1px solid var(--border-subtle);
}

/* ── BLOQUEO ────────────────────────────────────────────────── */
.bloqueo-overlay {
  display: none;
  position: fixed; inset: 0;
  z-index: 500;
  background: rgba(0,0,0,.8);
  backdrop-filter: blur(8px);
  align-items: center;
  justify-content: center;
}
.bloqueo-overlay.abierto { display: flex; }

.bloqueo-box {
  background: var(--bg-card);
  border: 1px solid rgba(239,68,68,.4);
  border-radius: var(--radius-xl);
  padding: var(--space-8);
  width: 100%;
  max-width: 360px;
  text-align: center;
  box-shadow: var(--shadow-elevated), 0 0 40px rgba(239,68,68,.15);
}

.bloqueo-box input {
  width: 100%;
  background: var(--bg-input);
  border: 1px solid var(--border-subtle);
  color: var(--text-primary);
  padding: 12px;
  border-radius: var(--radius-md);
  font-size: 15px;
  outline: none;
  text-align: center;
  letter-spacing: 4px;
  margin-bottom: var(--space-3);
  transition: border-color .2s;
}
.bloqueo-box input:focus { border-color: var(--border-strong); }

/* ── ANIMACIONES ────────────────────────────────────────────── */
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(20px); }
  to   { opacity: 1; transform: translateY(0); }
}

@media (max-width: 480px) {
  .login-box { padding: var(--space-8) var(--space-5); }
  .topbar { padding: var(--space-3) var(--space-4); }
  .contenido { padding: var(--space-6) var(--space-4); }
  .modulo { padding: var(--space-4) var(--space-5); }
}
</style>
</head>

<script>
/**
 * YUNCO — Configuración Central de Roles y Permisos

 * IMPORTANTE: Solo contiene definición estática de roles y permisos.
 * No contiene lógica de negocio ni acceso a datos.
 * Para modificar permisos, editar SOLO este archivo.
 */

const YUNCO_PERMISOS = {

  // ── CLAVES DEFAULT ──────────────────────────────────────────

    '1':'1111','2':'2222','3':'3333','4':'4444','5':'5555',

    'gerente':'gerente2024','dueno':'dueno2024','admin':'yunco2024'

  // ── CLAVE MAESTRA ───────────────────────────────────────────

  // ── MÁXIMO DE INTENTOS DE LOGIN ─────────────────────────────
  MAX_INTENTOS: 3,

  // ── TIEMPO DE INACTIVIDAD (minutos, 0 = sin límite) ─────────
  INACTIVIDAD_MIN: 0,

  // ── MÓDULOS VISIBLES POR ROL ────────────────────────────────

  MODULOS: {

    gerente:  ['ventas.html','inventario.html','caja.html','reportes.html'],
    dueno:    ['ventas.html','inventario.html','caja.html','reportes.html'],

  ACCESO_URL: {
    'ventas.html':     ['vendedor','gerente','dueno'],
    'inventario.html': ['vendedor','gerente','dueno','admin'],
    'caja.html':       ['gerente','dueno'],
    'reportes.html':   ['gerente','dueno'],

  // ── PERMISOS DENTRO DE VENTAS ───────────────────────────────
  VENTAS: {
    vendedor: {
      tabs:            ['nueva','presupuesto','consulta','clientes'],

      verTodosComp:    false,
      eliminarComp:    false,

    gerente: {

      config:          true,

    },
    admin: {
      tabs:            ['nueva','presupuesto','comprobantes','consulta','clientes','config'],
      comprobantes:    ['A','B','NC','ND','PRES'],
      verTodosComp:    true,
      eliminarComp:    true,
      config:          true,
      gestionUsuarios: false,
    },
  },

  // ── PERMISOS DENTRO DE INVENTARIO ───────────────────────────
  INVENTARIO: {
    vendedor: {
      tabs:             ['consulta','alertas'],
      verCostos:        false,
      verPrecioVenta:   true,
      modificar:        false,
    },
    gerente: {
      tabs:             ['stock','entrada','salida','historial','alertas','consulta'],
      verCostos:        false,
      verPrecioVenta:   true,
      modificar:        true,
    },
    dueno: {
      tabs:             ['stock','entrada','salida','historial','alertas','consulta'],

      modificar:        true,
    },
    admin: {
      tabs:             ['consulta','alertas'],
      verCostos:        false,
      verPrecioVenta:   false,
      modificar:        false,
    },
  },

  // ── PERMISOS DENTRO DE CAJA ─────────────────────────────────

    gerente: {
      abrirCerrar:  true,
      verResumen:   true,
      verHistorial: true,
    },
    dueno: {
      abrirCerrar:  true,
      verResumen:   true,
      verHistorial: true,
    },
  },

  // ── ETIQUETAS DE ROLES ──────────────────────────────────────
  ETIQUETAS: {
    vendedor: 'Vendedor',
    gerente:  'Gerente General',
    dueno:    'Dueño',
    admin:    'Admin Técnico',
  },

  // ── HELPER: obtener permisos de ventas para un rol ──────────
  getVentas(rol){ return this.VENTAS[rol] || this.VENTAS['vendedor']; },

  // ── HELPER: obtener permisos de inventario para un rol ──────

</script>

<script>
const S={g:(k,d)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):d;}catch{return d;}}};
const CD=YUNCO_PERMISOS.CLAVES_DEFAULT;

// ── Auditoría del Sistema desde index ────────────────────────
function auditSys(modulo, accion, detalle){
  try{
    const ses = localStorage.getItem('yunco_session');
    const usuario = ses ? JSON.parse(ses).usuario : 'desconocido';
    const rol = ses ? JSON.parse(ses).rol : '?';
    const nombre = ses ? JSON.parse(ses).nombre : '?';
    const reg = {
      id: Date.now(),
      fecha: new Date().toISOString(),
      usuario, usuarioNom: nombre, rol,
      modulo: modulo||'index',
      accion, detalle: detalle||''
    };
    const lista = JSON.parse(localStorage.getItem('yunco_audit_sys')||'[]');
    lista.unshift(reg);
    if(lista.length > 2000) lista.splice(2000);
    localStorage.setItem('yunco_audit_sys', JSON.stringify(lista));
  }catch(e){}
}

// BLOQUEO
function getIntentos(u){return S.g('yunco_login_intentos',{})[u]||{count:0,bloqueado:false};}
function registrarIntento(u,ok){
  const d=S.g('yunco_login_intentos',{});
  if(ok){d[u]={count:0,bloqueado:false};}
  else{const a=d[u]||{count:0,bloqueado:false};a.count++;if(a.count>=MAX_INTENTOS)a.bloqueado=true;d[u]=a;}
  localStorage.setItem('yunco_login_intentos',JSON.stringify(d));
}
function mostrarBloqueo(u){
  document.getElementById('bloqueoUsuario').value=u;
  document.getElementById('bloqueoMsg').textContent='El usuario "'+u+'" fue bloqueado por 3 intentos fallidos.';
  document.getElementById('bloqueoOverlay').classList.add('abierto');
}
function confirmarDesbloqueo(){
  const c=document.getElementById('desbloqueClave').value;
  const u=document.getElementById('bloqueoUsuario').value;
  const claves={...CD,...S.g('yunco_claves',{})};
  if(c===claves['gerente']||c===claves['dueno']){
    const d=S.g('yunco_login_intentos',{});
    d[u]={count:0,bloqueado:false};
    localStorage.setItem('yunco_login_intentos',JSON.stringify(d));
    document.getElementById('bloqueoOverlay').classList.remove('abierto');
    document.getElementById('desbloqueClave').value='';
    document.getElementById('desbloqueoErr').style.display='none';
  } else {
    document.getElementById('desbloqueoErr').style.display='block';
    document.getElementById('desbloqueClave').value='';
  }
}

// LOGIN
function doLogin(){
  const u=document.getElementById('loginUsuario').value;
  const c=document.getElementById('loginClave').value;
  const errEl=document.getElementById('loginErr');
  if(!u){errEl.textContent='Seleccioná un usuario.';errEl.style.display='block';return;}
  // Verificar bloqueo
  const intentos=getIntentos(u);
  if(intentos.bloqueado){mostrarBloqueo(u);return;}
  const claves={...CD,...S.g('yunco_claves',{})};
  if(c!==claves[u]){
    registrarIntento(u,false);
    const actual=getIntentos(u);
    if(actual.bloqueado){mostrarBloqueo(u);}
    else{const r=MAX_INTENTOS-actual.count;errEl.textContent='Clave incorrecta. Te quedan '+r+' intento(s).';errEl.style.display='block';document.getElementById('loginClave').value='';}
    return;
  }
  registrarIntento(u,true);
  // Determinar rol
  const rolMap={gerente:'gerente',dueno:'dueno',admin:'admin'};
  const rol=rolMap[u]||'vendedor';
  const vends=S.g('yunco_vend',{});
  const nombre=vends[u]?.nombre||(u==='gerente'?'Gerente General':u==='dueno'?'Dueño':u==='admin'?'Admin Técnico':'Vendedor '+u);
  // Guardar sesión
  const sesion={usuario:u,rol,nombre,inicio:new Date().toISOString()};
  localStorage.setItem('yunco_session',JSON.stringify(sesion));
  errEl.style.display='none';
  mostrarSistema(sesion);
}

function mostrarSistema(ses){
  // Registrar login en auditoría
  auditSys('index', 'LOGIN', 'Ingreso al sistema — rol: ' + ses.rol);
  document.getElementById('loginWrap').style.display='none';
  const sw=document.getElementById('sistemaWrap');
  sw.style.display='flex';
  document.getElementById('userBadge').textContent='👤 '+ses.nombre+' · '+ses.rol.charAt(0).toUpperCase()+ses.rol.slice(1);
  document.getElementById('menuSaludo').textContent='Bienvenido, '+ses.nombre;
  document.getElementById('fechaActual').textContent=new Date().toLocaleDateString('es-AR',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  // Render módulos según rol
  const mods=MODULOS_ROL[ses.rol]||MODULOS_ROL['vendedor'];
  document.getElementById('modulosGrid').innerHTML=mods.map((m,i)=>`
<a href="${m.href}" class="modulo ${m.color}" style="animation:fadeUp .4s ${i*.08}s ease both">
  <div class="icono-wrap">${m.icono}</div>
  <div style="flex:1">
    <div class="mod-nombre">${m.nombre}</div>
    <div class="mod-desc">${m.desc}</div>
  </div>
  <span class="flecha">›</span>
</a>`).join('');
}

function cerrarSesion(){
  auditSys('index', 'LOGOUT', 'Cierre de sesión desde menú principal');
  localStorage.removeItem('yunco_session');
  document.getElementById('sistemaWrap').style.display='none';
  document.getElementById('loginWrap').style.display='flex';
  document.getElementById('loginUsuario').value='';
  document.getElementById('loginClave').value='';
}

// VERIFICAR SESION EXISTENTE AL CARGAR
window.addEventListener('load',()=>{
  const s=localStorage.getItem('yunco_session');
  if(s){try{mostrarSistema(JSON.parse(s));}catch{localStorage.removeItem('yunco_session');}}
});

// Auditoría desde index
function auditLogin(usuario, nombre, rol, accion){
  try{
    const reg = {
      id: Date.now(),
      fecha: new Date().toISOString(),
      usuario, usuarioNom: nombre, rol,
      modulo: 'index', accion,
      detalle: accion==='LOGIN' ? 'Inicio de sesión exitoso' : 'Cierre de sesión'
    };
    const lista = JSON.parse(localStorage.getItem('yunco_audit_sys')||'[]');
    lista.unshift(reg);
    if(lista.length > 2000) lista.splice(2000);
    localStorage.setItem('yunco_audit_sys', JSON.stringify(lista));
  } catch(e){}
}
